[package]
name = "magnetar"
version = "0.1.0"
description = "Magnetar — local BYOK AI coding agent"
authors = ["Hamid Kazimov"]
edition = "2021"

[lib]
name = "magnetar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP + streaming. rustls so we control the trust store (needed for GigaChat's
# Russian Trusted Root CA later). rustls-tls-native-roots keeps OS roots too.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-native-roots",
    "multipart",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
pdf-extract = "0.7"
base64 = "0.22"

# Secrets: secrets.json in the app data dir (0600). security-framework stays
# only to migrate keys out of the old Keychain storage and delete them there.
security-framework = "3"

# Local DB (canon transcript, sessions). Bundled = no system sqlite needed.
rusqlite = { version = "0.32", features = ["bundled"] }

# Misc
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "2"
once_cell = "1"
regex = "1"
wait-timeout = "0.2"
portable-pty = "0.8"
libc = "0.2.189"
