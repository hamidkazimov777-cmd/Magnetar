<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetar</title>
    <!-- Paint the right ground on the very first frame, before the bundle
         loads, so launching never flashes the opposite theme. Light is the
         default; the persisted choice wins if there is one. -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      /* Only <html> is painted here. Painting <body> too would beat the app's
         own layered styles, since unlayered CSS outranks @layer. */
      html {
        background: #ffffff;
      }
      html[data-theme="dark"] {
        background: #000000;
      }
    </style>
    <script>
      (function () {
        // In the packaged app the native shell already set data-theme before
        // this runs (authoritative, from the saved theme) — don't override it.
        // This branch only matters in the browser/dev, where there is no shell.
        if (document.documentElement.getAttribute("data-theme")) return;
        try {
          var raw = localStorage.getItem("magnetar-store");
          var theme = raw ? JSON.parse(raw).state.theme : "light";
          if (theme === "system")
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme || "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
